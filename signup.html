<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Member Sign Up | Bin Taha Associates App</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Central Master Core Bridge -->
  <script src="https://bintahaassociates.github.io/bintaha-acconting/bintaha-core.js"></script>
  
  <style>
    .shining-gold { color: #fcd34d; text-shadow: 0 0 25px rgba(252, 211, 77, 0.6); }
    .gold-glow { box-shadow: 0 0 45px rgba(252, 211, 77, 0.35); }
    .glass-card { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(252, 211, 77, 0.25); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950 pb-24">

  <!-- Mobile Top Connectivity Bar -->
  <div class="bg-slate-950/90 border-b border-slate-800 text-[11px] px-4 py-1.5 flex justify-between items-center z-40 sticky top-0 backdrop-blur-md">
    <div class="flex items-center gap-2">
      <span class="flex items-center gap-1 text-emerald-400 font-bold"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online</span>
      <span class="text-slate-600">|</span>
      <span class="text-slate-400">Security: <strong class="text-amber-400">AES-256 Active</strong></span>
    </div>
    <a href="tel:03219404812" class="text-amber-400 font-bold"><i class="fa-solid fa-phone text-xs"></i> 0321-9404812</a>
  </div>

  <!-- Header -->
  <header class="bg-slate-900/95 border-b border-slate-800 px-4 py-3 sticky top-[33px] z-30 backdrop-blur-md shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <a href="./index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-slate-950 border border-amber-500/50 flex items-center justify-center overflow-hidden shadow gold-glow shrink-0">
          <img src="./logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=150&q=80'">
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-black text-white leading-tight">Bin Taha Associates</h1>
          <p class="text-[9px] sm:text-[10px] text-amber-400 font-bold uppercase tracking-wider">Create Account & Join CRM</p>
        </div>
      </a>
      <div class="flex items-center gap-2">
        <a href="./signin.html" class="bg-slate-800 text-amber-400 font-bold px-3 py-1.5 rounded-xl text-xs border border-amber-500/40">Sign In</a>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-8 flex-1 w-full flex items-center">
    <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-2xl gold-glow border-2 border-amber-500/50 space-y-5 w-full">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-amber-500 text-slate-950 flex items-center justify-center text-xl font-bold mx-auto shadow">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 class="text-2xl font-black shining-gold">Create Account</h2>
        <p class="text-xs text-slate-400">Join the Bin Taha network for priority property deals</p>
      </div>

      <form onsubmit="handleClientSignUp(event)" class="space-y-3.5 text-xs font-bold">
        <div>
          <label class="block text-slate-300 mb-1">Full Name *</label>
          <input type="text" id="signUpName" required placeholder="Enter full name" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-amber-500 font-normal">
        </div>
        <div>
          <label class="block text-slate-300 mb-1">Phone Number *</label>
          <input type="tel" id="signUpPhone" required value="03219404812" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-amber-500 font-normal">
        </div>
        <div>
          <label class="block text-slate-300 mb-1">Email Address *</label>
          <input type="email" id="signUpEmail" required placeholder="you@example.com" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-amber-500 font-normal">
        </div>
        <div>
          <label class="block text-slate-300 mb-1">Create Password *</label>
          <input type="password" id="signUpPass" required placeholder="Create password" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-amber-500 font-normal">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3.5 rounded-xl transition shadow-xl cursor-pointer uppercase tracking-wider">
          Register Account & Sync CRM
        </button>
      </form>
      <p class="text-center text-xs text-slate-400">Already registered? <a href="./signin.html" class="text-amber-400 font-bold hover:underline">Sign In here</a></p>
    </div>
  </main>

  <!-- Persistent Mobile Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/95 border-t border-slate-800 py-2 px-3 z-40 backdrop-blur-lg flex justify-around items-center">
    <a href="./index.html" class="flex flex-col items-center gap-1 text-slate-400"><i class="fa-solid fa-house text-sm"></i><span class="text-[10px]">Home</span></a>
    <a href="./properties.html" class="flex flex-col items-center gap-1 text-slate-400"><i class="fa-solid fa-building text-sm"></i><span class="text-[10px]">Properties</span></a>
    <a href="./signup.html" class="flex flex-col items-center gap-1 text-amber-400 font-black"><i class="fa-solid fa-user-plus text-sm"></i><span class="text-[10px]">Sign Up</span></a>
    <a href="./services.html" class="flex flex-col items-center gap-1 text-slate-400"><i class="fa-solid fa-bolt text-sm"></i><span class="text-[10px]">Services</span></a>
  </nav>

  <script>
    function handleClientSignUp(e) {
      e.preventDefault();
      const name = document.getElementById('signUpName').value.trim();
      const phone = document.getElementById('signUpPhone').value.trim();
      const email = document.getElementById('signUpEmail').value.trim();
      const regCode = 'BTA-REG-' + Math.floor(100000 + Math.random() * 900000);

      const record = {
        name: name,
        phone: phone,
        email: email,
        subject: 'New Client Account Created',
        text: `Client ${name} registered. Phone: ${phone}, Email: ${email}. Code: ${regCode}`
      };

      if (typeof btaSyncToSheet === 'function') {
        btaSyncToSheet(record, "Leads", () => {
          alert(`🎉 Account Created! Verification Code: ${regCode}`);
          window.location.href = './signin.html';
        });
      } else {
        alert("Account Created Locally!");
        window.location.href = './signin.html';
      }
    }
  </script>
</body>
</html>
